[project]
name = "wagtail-ai-humans"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "gunicorn==25.1.0",
    "psycopg[binary]>=3.2,<4",
    "wagtail>=8.0.1",
    "whitenoise>=6.12.0",
]

[tool.ruff]
target-version = "py314"
line-length = 88
# Skills contain imported utilities and unrendered bootstrap templates.
extend-exclude = [".agents"]
force-exclude = true

[tool.ruff.format]
exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Django settings deliberately import the complete base and optional local settings.
"config/settings/dev.py" = ["F403"]
# Production also accesses settings provided by the wildcard import.
"config/settings/production.py" = ["F403", "F405"]
# Keep error checks on migrations without enforcing import formatting.
"**/migrations/*.py" = ["I"]

[dependency-groups]
dev = [
    "ruff==0.17.3",
]
