[tool.ruff]
target-version = "__RUFF_TARGET_VERSION__"
line-length = 88
# Skills contain imported guidance and utilities rather than application code.
extend-exclude = [".agents"]
force-exclude = true

[tool.ruff.format]
exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Django settings deliberately import the complete base and optional local settings.
"config/settings/dev.py" = ["F403"]
# Production also accesses settings provided by the wildcard import.
"config/settings/production.py" = ["F403", "F405"]
# Keep error checks on migrations without enforcing import formatting.
"**/migrations/*.py" = ["I"]
